[ids]

*

[main]

# Maps capslock to escape when pressed and control when held.
capslock = overload(control, esc)

# swap alt and windows keys
leftalt = leftmeta 
leftmeta = leftalt
rightalt = rightmeta
rightmeta = rightalt

# unmap Escape key
esc = noop

# Map RShift
rightshift = rightshift

# use menu as compose key
menu = compose
